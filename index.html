<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quach Music Studio - Загрузка треков</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="upload-container">
        <div class="logo">QUACH <span>Music</span></div>
        <h1>Добавить новый трек</h1>
        <p class="subtitle">Загрузи песню, и она мгновенно появится в твоем WPF-плеере</p>

        <form id="uploadForm">
            <div class="input-group">
                <label for="trackTitle">Название трека</label>
                <input type="text" id="trackTitle" placeholder="Например: Локоны" required>
            </div>

            <div class="input-group">
                <label for="trackArtist">Исполнитель (Артист)</label>
                <input type="text" id="trackArtist" placeholder="Например: Скриптонит" required>
            </div>

            <div class="input-group">
                <label for="trackAlbum">Альбом (Необязательно)</label>
                <input type="text" id="trackAlbum" placeholder="Например: Праздник на улице 36">
            </div>

            <div class="file-drop-area" id="dropArea">
                <span class="fake-btn">Выбрать MP3 файл</span>
                <span class="file-msg">или перетащи его сюда</span>
                <input class="file-input" type="file" id="audioFile" accept="audio/mpeg" required>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">Загрузить в облако Quach</button>
        </form>

        <!-- Индикатор загрузки -->
        <div class="progress-bar-container" id="progressContainer" style="display: none;">
            <div class="progress-bar" id="progressBar">0%</div>
        </div>
        <div id="statusMessage" class="status-msg"></div>
    </div>

    <!-- Наш будущий скрипт для отправки файлов в облако -->
    <script type="module" src="app.js"></script>
</body>
</html>
